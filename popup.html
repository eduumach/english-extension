<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>
        <svg class="app-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        English Study
      </h1>
      <div class="count">
        <span id="total">0</span> palavras conhecidas
      </div>
    </header>

    <div class="row">
      <input id="search" type="text" placeholder="Buscar palavra..." />
      <input id="add-input" type="text" placeholder="Adicionar palavra" />
      <button id="add-btn">+</button>
    </div>

    <div class="row actions">
      <button id="export">Exportar JSON</button>
      <button id="import">Importar JSON</button>
      <button id="clear" class="danger">Limpar tudo</button>
      <input type="file" id="file-input" accept="application/json" hidden />
    </div>

    <div class="row actions">
      <button id="export-seen" title="Exportar todas as palavras vistas em videos, com frequencia">
        Exportar vistas (<span id="seen-total">0</span>)
      </button>
      <button id="clear-seen" class="danger" title="Limpar historico de palavras vistas">Limpar vistas</button>
    </div>

    <ul id="list"></ul>

    <footer>
      Abra um video no YouTube e ative as legendas (CC). Clique em qualquer
      palavra para marca-la como conhecida.
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
