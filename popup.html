<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        English Study
      </h1>
      <label class="switch" title="Desative para assistir sem a extensao">
        <input type="checkbox" id="enabled" />
        <span class="track"></span>
      </label>
    </header>

    <p class="state" id="state"></p>

    <div class="stats">
      <button class="stat" data-open="vocab">
        <b id="known" class="green">0</b><span>aprendidas</span>
      </button>
      <button class="stat" data-open="cards">
        <b id="cards-new" class="blue">0</b><span>cartoes novos</span>
      </button>
      <button class="stat" data-open="home">
        <b id="accuracy">—</b><span>acerto</span>
      </button>
    </div>

    <button class="primary" data-open="">Abrir hub de estudo</button>
    <button class="secondary" id="export-cards" hidden></button>

    <button class="notice" id="llm-notice" data-open="settings" hidden>
      Configure a IA para ter exercicios e cartoes automaticos →
    </button>

    <p class="hint">Abra um video com legendas no YouTube. Clique numa palavra para marca-la como aprendida.</p>

    <script src="llm.js"></script>
    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
