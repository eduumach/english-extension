<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Glossa screenshot frame 1280x800</title>
<link rel="stylesheet" href="../promo/promo.css" />
<style>
  /* One store screenshot: headline on top, the real screenshot below bleeding off the bottom.
     Filled from the query string: ?img=raw/1-video.jpg&title=...&sub=... */
  body { width: 1280px; height: 800px; position: relative; }
  .g1 { width: 520px; height: 520px; background: var(--known); left: -200px; top: -260px; }
  .g2 { width: 520px; height: 520px; background: var(--new); right: -200px; top: -280px; opacity: 0.16; }
  header { position: absolute; top: 46px; left: 0; right: 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .brand { gap: 10px; font-size: 18px; color: var(--muted); }
  .brand svg { width: 26px; height: 26px; border-radius: 7px; box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }
  .brand b { font-weight: 700; letter-spacing: -0.01em; }
  h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.035em; }
  p { font-size: 18px; color: var(--muted); max-width: 820px; line-height: 1.45; }
  .shot { position: absolute; left: 50%; top: 236px; width: 1080px; transform: translateX(-50%); border-radius: 16px 16px 0 0; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.1); }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <header>
    <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#1A1A1A"/><rect x="18" y="21.25" width="64" height="13.5" rx="6.75" fill="#FF9E5E"/><rect x="18" y="21.25" width="46.08" height="13.5" rx="6.75" fill="#FFE066"/><rect x="18" y="21.25" width="26.88" height="13.5" rx="6.75" fill="#7FD17F"/><rect x="18" y="43.25" width="64" height="13.5" rx="6.75" fill="#FF9E5E"/><rect x="18" y="43.25" width="32" height="13.5" rx="6.75" fill="#FFE066"/><rect x="18" y="43.25" width="17.92" height="13.5" rx="6.75" fill="#7FD17F"/><rect x="18" y="65.25" width="49.92" height="13.5" rx="6.75" fill="#FF9E5E"/><rect x="18" y="65.25" width="39.68" height="13.5" rx="6.75" fill="#FFE066"/><rect x="18" y="65.25" width="25.6" height="13.5" rx="6.75" fill="#7FD17F"/></svg><b>Glossa</b></div>
    <h1 id="title"></h1>
    <p id="sub"></p>
  </header>
  <div class="shot"><img id="img" alt="" /></div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById("title").textContent = q.get("title");
    document.getElementById("sub").textContent = q.get("sub");
    document.getElementById("img").src = q.get("img");
  </script>
</body>
</html>
